services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      GIN_MODE: release
      LOG_FORMAT: json
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
